name: CI

on:
  pull_request:
    branches: [develop, stage, main]
  push:
    branches: [develop, stage, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hd_cms_prototype
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d hd_cms_prototype"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/hd_cms_prototype
      PAYLOAD_SECRET: ci-local-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
